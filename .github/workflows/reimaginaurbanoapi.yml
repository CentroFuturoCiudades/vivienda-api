name: Build and Deploy FastAPI to Azure VM (Local Image)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3
       
      - name: Add VM to known_hosts
        run: ssh-keyscan -H ${{ secrets.AZURE_VM_IP }} >> ~/.ssh/known_hosts

      # 2. Set up SSH agent
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.AZURE_SSH_KEY }}

      # 3. Copy source code to VM
      - name: Copy project to Azure VM
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            ./ \
            ${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_VM_IP }}:/home/${{ secrets.AZURE_SSH_USER }}/reimagina_urbano

      # 4. Build & run Docker image ON the VM
      - name: Build and Run Docker on Azure VM
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            
            set -e

            cd ~/reimagina_urbano

            IMAGE_NAME=reimaginaurbano:latest

            echo "Building Docker image locally..."
            docker build -t $IMAGE_NAME .

            echo "Stopping old container..."
            docker stop reimagina_urbano_app || true
            docker rm reimagina_urbano_app || true

            echo "Starting new container..."
            docker run -d \
              --name reimagina_urbano_app \
              -p 8000:8000 \
              -e POSTGRES_USER="${POSTGRES_USER}" \
              -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
              -e POSTGRES_HOST="${POSTGRES_HOST}" \
              -e POSTGRES_PORT=5432 \
              -e POSTGRES_DB="${POSTGRES_DB}" \
              -e ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" \
              --restart unless-stopped \
              $IMAGE_NAME

            echo "Deployment complete."
          EOF
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
